# Variables de entorno: se leen del sistema o de un archivo .env en la raiz del proyecto (ver .env.example)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/mobiliario_eventos
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-stacktrace=never

jwt.secret.key=${JWT_SECRET_KEY}
jwt.time.expiration=86400000

myapp.userinit=${ADMIN_USERNAME}
myapp.passwordinit=${ADMIN_PASSWORD}

# Configuracion para el envio de email´s

email.sender=${EMAIL_SENDER:}
email.password=${EMAIL_PASSWORD:}

# Para habilitar el manejo de archivos en Spring debemos agregar:
spring.servlet.multipart.enabled=true
## Especificamos el tamaño maximo de archivos que vamos a recibir en la aplicacion
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


