# Las credenciales se leen de variables de entorno (ver .env.example).
# Para desarrollo local tambien se puede crear un archivo .env en la raiz del proyecto
# (esta en .gitignore y nunca debe subirse al repositorio).
spring.config.import=optional:file:.env[.properties]

# Base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mobiliario_eventos}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-stacktrace=never

# JWT (clave en Base64 de al menos 256 bits; genera una con: openssl rand -base64 32)
jwt.secret.key=${JWT_SECRET_KEY}
jwt.time.expiration=${JWT_EXPIRATION:86400000}

# Usuario administrador que se crea en la primera ejecucion
myapp.userinit=${ADMIN_USERNAME:admin}
myapp.passwordinit=${ADMIN_PASSWORD}

# Envio de emails (cuenta de Gmail con contrasena de aplicacion)
email.sender=${EMAIL_SENDER:}
email.password=${EMAIL_PASSWORD:}

# Manejo de archivos
spring.servlet.multipart.enabled=true
# Tamano maximo de archivos que vamos a recibir en la aplicacion
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
